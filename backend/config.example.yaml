clusters:
- name: Default
  host: http://localhost:8080

server:
  cors: true
  # TLS and client authentication are independently opt-in; see docs/tls.md.
  tls:
    enabled: false
    clientAuth:
      enabled: false
  metrics:
    enabled: false
    port: 9090
    tls:
      enabled: false
      clientAuth:
        enabled: false
  overwriteHost: true

tempDir: /private/tmp